name: Build

on:
  push:
    branches: [main]
    # Only version tags like v0.1.1. The tags of the original project (version-2.8) do not match.
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Check that the tag matches the version in package.json
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi

      - run: npm ci

      - name: Run regression tests
        run: npm test

      - name: Build and package
        run: |
          name="bilibili-ambilight-$(node -p "require('./package.json').version")"
          mkdir release

          npm run build
          (cd dist && zip -qr "../release/$name-chrome.zip" .)

          # Firefox only supports background.scripts, the rest of the build is the same
          node manifest-copy.js firefox
          (cd dist && zip -qr "../release/$name-firefox.zip" .)

          # The userscript is a single self-contained file
          npm run build:userscript
          cp bilibili-ambilight.user.js release/

          (cd release && sha256sum *.zip *.user.js > SHA256SUMS.txt)
          ls -l release

      - uses: actions/upload-artifact@v7
        with:
          name: bilibili-ambilight
          path: release/
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          name: bilibili-ambilight
          path: release

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_notes=()
          if [ -f ".github/release-notes/$GITHUB_REF_NAME.md" ]; then
            release_notes=(--notes-file ".github/release-notes/$GITHUB_REF_NAME.md")
          fi
          gh release create "$GITHUB_REF_NAME" release/*.zip release/bilibili-ambilight.user.js release/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --generate-notes "${release_notes[@]}"

      # The install links of the userscript point to this branch (directly and through the jsDelivr mirror),
      # so that userscript managers only update to released versions.
      - name: Publish the userscript to the userscript branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch -q "$remote" refs/heads/userscript
          git worktree add -q --detach userscript FETCH_HEAD
          cp release/bilibili-ambilight.user.js userscript/
          cd userscript
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bilibili-ambilight.user.js
          git commit -q -m "Userscript $GITHUB_REF_NAME"
          git push -q "$remote" HEAD:refs/heads/userscript

      - name: Purge the jsDelivr cache of the userscript
        continue-on-error: true
        run: curl -fsS "https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@userscript/bilibili-ambilight.user.js"
